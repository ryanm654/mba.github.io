<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Manchester Battle Arena - tournament results by game"/>
  <link rel="icon" href="favicon.png" />
  <title>Tournament Results | Manchester Battle Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #D91E18;
      --red-dark: #A01510;
      --red-dim: rgba(217,30,24,0.12);
      --white: #F5F0ED;
      --off: #1a1a1a;
      --mid: #2e2e2e;
      --subtle: #555;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--off);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem 3rem;
      background: rgba(26,26,26,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(217,30,24,0.2);
    }

    .nav-logo-img {
      height: 70px;
      width: auto;
      display: block;
    }

    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #aaa;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--red); }

    /* ── PAGE HERO ── */
    #page-hero {
      min-height: 42vh;
      display: flex; flex-direction: column; justify-content: center;
      padding: 8rem 3rem 3rem;
      position: relative;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute; inset: 0; z-index: 0;
      background:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 79px,
          rgba(217,30,24,0.04) 79px,
          rgba(217,30,24,0.04) 80px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 79px,
          rgba(217,30,24,0.04) 79px,
          rgba(217,30,24,0.04) 80px
        );
    }

    .hero-glow {
      position: absolute; top: -10%; right: -5%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(217,30,24,0.18) 0%, transparent 65%);
      z-index: 0;
    }

    .page-hero-content { position: relative; z-index: 1; max-width: 900px; }

    .section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 0.75rem;
    }

    .page-hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 9vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: 0.02em;
      color: var(--white);
    }

    .page-hero-sub {
      margin-top: 1.5rem;
      font-size: 1.05rem;
      color: #999;
      max-width: 560px;
      line-height: 1.7;
    }

    .page-hero-stats {
      margin-top: 2.5rem;
      display: flex; gap: 3rem; flex-wrap: wrap;
    }
    .stat { border-left: 2px solid var(--red); padding-left: 1rem; }
    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      color: var(--white);
      line-height: 1;
    }
    .stat-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--subtle);
    }

    /* ── DIVIDER ── */
    .divider {
      width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(217,30,24,0.4), transparent);
    }

    /* ── SCENE FILTER ── */
    #scene-filter {
      background: #141414;
      padding: 2.5rem 3rem 0.5rem;
    }
    .scene-filter-inner { max-width: 1100px; margin: 0 auto; }
    .scene-filter-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--subtle);
      margin-bottom: 1rem;
    }
    .scene-filter-buttons { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .scene-filter-btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--red);
      color: var(--white);
      border: 1px solid var(--red);
      padding: 0.65rem 1.5rem;
      cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .scene-filter-btn:not(.active) {
      background: transparent;
      color: var(--subtle);
      border-color: rgba(245,240,237,0.15);
    }
    .scene-filter-btn:hover { border-color: var(--red); color: var(--white); }

    /* ── JUMP NAV ── */
    #jump-nav {
      background: #141414;
      padding: 2rem 3rem;
    }
    .jump-nav-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; flex-wrap: wrap; gap: 0.6rem;
    }
    .jump-nav-inner a {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #aaa;
      text-decoration: none;
      background: var(--mid);
      padding: 0.5rem 1rem;
      border: 1px solid transparent;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
      transition: color 0.2s, border-color 0.2s;
    }
    .jump-nav-inner a:hover { color: var(--red); border-color: rgba(217,30,24,0.4); }

    /* ── RESULTS ── */
    #results { background: var(--off); padding: 5rem 3rem; }

    .results-inner {
      max-width: 1100px; margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      align-items: start;
      gap: 3rem;
    }

    .game-block {
      background: var(--mid);
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
      position: relative;
      overflow: hidden;
    }
    .game-block::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--red);
    }

    .game-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid rgba(245,240,237,0.08);
      gap: 1rem; flex-wrap: wrap;
    }

    .game-logo-wrap { display: flex; align-items: center; min-height: 40px; }
    .game-logo { max-height: 40px; max-width: 220px; width: auto; display: block; }
    .game-logo-fallback {
      display: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.03em;
      color: var(--white);
    }
    .game-logo-wrap.no-logo .game-logo { display: none; }
    .game-logo-wrap.no-logo .game-logo-fallback { display: block; }

    .placement-count {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--white);
      white-space: nowrap;
    }

    .entrant-count {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--white);
      white-space: nowrap;
    }

    .result-list { list-style: none; }
    .result-row {
      display: flex; align-items: baseline; gap: 1.2rem;
      padding: 0.85rem 2rem;
      border-bottom: 1px solid rgba(245,240,237,0.05);
      transition: background 0.15s;
    }
    .result-row:last-child { border-bottom: none; }
    .result-row:hover { background: rgba(217,30,24,0.05); }

    .result-rank {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      color: var(--white);
      min-width: 3.2rem;
      flex-shrink: 0;
    }

    .result-name {
      font-size: 0.95rem;
      color: var(--white);
    }

    .team-prefix {
      font-weight: 700;
      margin-right: 0.4rem;
    }
    .team-prefix.mba { color: #C0392B; }
    .team-prefix.mfgc { color: #E85D9E; }
    .team-prefix.sfo { color: #7D3C98; }

    /* ── FOOTER ── */
    footer {
      background: #0e0e0e;
      padding: 2.5rem 3rem;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
      border-top: 1px solid rgba(217,30,24,0.15);
    }

    .footer-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      color: var(--white);
    }
    .footer-logo span { color: var(--red); }

    footer p {
      font-size: 0.82rem;
      color: #555;
    }

    .footer-links { display: flex; gap: 1.5rem; }
    .footer-links a {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--red); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      #page-hero { padding: 7rem 1.5rem 2.5rem; }
      #scene-filter { padding: 2rem 1.5rem 0.5rem; }
      #jump-nav { padding: 1.5rem; }
      #results { padding: 3rem 1.5rem; }
      .game-header { padding: 1.2rem 1.5rem; }
      .result-row { padding: 0.75rem 1.5rem; }
      footer { flex-direction: column; align-items: flex-start; padding: 2rem 1.5rem; }
    }

    .load-status {
      max-width: 1100px; margin: 0 auto;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--subtle);
      padding: 1rem 0;
    }
    .load-status.error { color: var(--red); }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="index.html#hero" class="nav-logo">
      <img src="logo.png" alt="Manchester Battle Arena" class="nav-logo-img" />
    </a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#events">Events</a></li>
      <li><a href="results.html" class="active">Results</a></li>
      <li><a href="index.html#join">Contact Us</a></li>
    </ul>
  </nav>

  <!-- PAGE HERO -->
  <section id="page-hero">
    <div class="hero-bg"></div>
    <div class="hero-glow"></div>
    <div class="page-hero-content">
      <p class="section-label" id="hero-label">Tournament Recap</p>
      <h1 class="page-hero-title" id="hero-title">Loading&hellip;</h1>
      <p class="page-hero-sub" id="hero-subtitle"></p>
      <div class="page-hero-stats">
        <div class="stat">
          <div class="stat-num" id="stat-games">&mdash;</div>
          <div class="stat-label">Games</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="stat-placements">&mdash;</div>
          <div class="stat-label">Placements</div>
        </div>
      </div>
    </div>
  </section>

  <!-- SCENE FILTER -->
  <section id="scene-filter">
    <div class="scene-filter-inner">
      <p class="scene-filter-label">Filter by Scene</p>
      <div class="scene-filter-buttons" id="scene-filter-buttons">
        <!-- populated dynamically -->
      </div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- JUMP NAV -->
  <section id="jump-nav">
    <div class="jump-nav-inner" id="jump-nav-inner">
      <!-- populated dynamically -->
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results">
    <p class="load-status" id="load-status">Loading results&hellip;</p>
    <div class="results-inner" id="results-inner">
      <!-- populated dynamically -->
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-logo">Manchester <span>Battle Arena</span></div>
    <p>© 2026 Manchester Battle Arena. All rights reserved.</p>
    <div class="footer-links">
      <a href="index.html#about">About</a>
      <a href="index.html#events">Events</a>
      <a href="results.html">Results</a>
      <a href="index.html#join">Contact</a>
    </div>
  </footer>

  <script>
    const DATA_URL = 'vsf-results.json';

    function ordinal(n) {
      const s = ["th", "st", "nd", "rd"];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function el(tag, opts = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(opts).forEach(([k, v]) => {
        if (k === 'className') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k === 'html') node.innerHTML = v;
        else node.setAttribute(k, v);
      });
      children.forEach((c) => node.appendChild(c));
      return node;
    }

    function buildResultRow(result, teams) {
      const row = el('li', { className: 'result-row', 'data-scene': result.scene });
      row.appendChild(el('span', { className: 'result-rank', text: ordinal(result.placement) }));

      const nameSpan = el('span', { className: 'result-name' });
      (result.teams || []).forEach((code) => {
        const teamInfo = teams[code];
        if (!teamInfo) return;
        const prefix = el('span', {
          className: `team-prefix ${code}`,
          text: teamInfo.label,
          style: `color:${teamInfo.color}`
        });
        nameSpan.appendChild(prefix);
      });
      nameSpan.appendChild(document.createTextNode(result.name));
      row.appendChild(nameSpan);
      return row;
    }

    function buildGameBlock(game, teams) {
      const block = el('div', { className: 'game-block', id: game.slug });

      const header = el('div', { className: 'game-header' });
      const logoWrap = el('div', { className: 'game-logo-wrap' });

      const img = el('img', {
        className: 'game-logo',
        src: game.logo || `logos/${game.slug}.png`,
        alt: game.name
      });
      img.addEventListener('error', () => logoWrap.classList.add('no-logo'));
      logoWrap.appendChild(img);
      logoWrap.appendChild(el('span', { className: 'game-logo-fallback', text: game.name }));
      header.appendChild(logoWrap);

      const countWrap = el('span');
      if (game.entrants != null) {
        countWrap.appendChild(el('span', {
          className: 'entrant-count',
          text: `${game.entrants} Entrants, `
        }));
      }
      countWrap.appendChild(el('span', { className: 'placement-count' }));
      header.appendChild(countWrap);

      block.appendChild(header);

      const list = el('ul', { className: 'result-list' });
      game.results.forEach((r) => list.appendChild(buildResultRow(r, teams)));
      block.appendChild(list);

      return block;
    }

    function setupFilters(scenes) {
      const filterButtons = document.querySelectorAll('.scene-filter-btn');
      const gameBlocks = document.querySelectorAll('.game-block');

      const activeScenes = new Set(scenes);

      function applyFilters() {
        gameBlocks.forEach((block) => {
          const rows = block.querySelectorAll('.result-row');
          let visibleCount = 0;

          rows.forEach((row) => {
            const visible = activeScenes.has(row.dataset.scene);
            row.style.display = visible ? '' : 'none';
            if (visible) visibleCount += 1;
          });

          const countEl = block.querySelector('.placement-count');
          if (countEl) {
            const label = visibleCount === 1 ? 'Placement' : 'Placements';
            countEl.textContent = `${visibleCount} ${label}`;
          }

          const hasVisible = visibleCount > 0;
          block.style.display = hasVisible ? '' : 'none';

          const jumpLink = document.querySelector(`.jump-nav-inner a[href="#${block.id}"]`);
          if (jumpLink) jumpLink.style.display = hasVisible ? '' : 'none';
        });
      }

      filterButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const scene = btn.dataset.scene;
          if (activeScenes.has(scene)) {
            activeScenes.delete(scene);
            btn.classList.remove('active');
            btn.setAttribute('aria-pressed', 'false');
          } else {
            activeScenes.add(scene);
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
          }
          applyFilters();
        });
      });

      applyFilters();
    }

    async function init() {
      const statusEl = document.getElementById('load-status');
      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        document.getElementById('hero-label').textContent = data.sectionLabel || 'Tournament Recap';
        document.getElementById('hero-title').textContent = data.tournament || 'Results';
        document.getElementById('hero-subtitle').textContent = data.subtitle || '';
        document.getElementById('stat-games').textContent = data.games.length;
        document.getElementById('stat-placements').textContent =
          data.games.reduce((sum, g) => sum + g.results.length, 0);

        const filterButtonsWrap = document.getElementById('scene-filter-buttons');
        data.scenes.forEach((scene) => {
          filterButtonsWrap.appendChild(el('button', {
            type: 'button',
            className: 'scene-filter-btn active',
            'data-scene': scene,
            'aria-pressed': 'true',
            text: scene
          }));
        });

        const jumpNavWrap = document.getElementById('jump-nav-inner');
        const resultsWrap = document.getElementById('results-inner');

        data.games.forEach((game) => {
          jumpNavWrap.appendChild(el('a', { href: `#${game.slug}`, text: game.name }));
          resultsWrap.appendChild(buildGameBlock(game, data.teams));
        });

        statusEl.remove();
        setupFilters(data.scenes);
      } catch (err) {
        statusEl.textContent = `Couldn't load results (${err.message}). If you're opening this file directly from disk, try serving it from a local web server instead.`;
        statusEl.classList.add('error');
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
